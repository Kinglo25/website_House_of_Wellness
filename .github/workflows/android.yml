name: Build Android APK

# Builds the sideloadable APK for Android TV and Android phones. GitHub's
# runners already have the Android SDK, so nobody needs Android Studio.
#
# The APK carries StreamHouse itself — streamhouse/server, public and the
# server's node_modules — so a change there rebuilds it too.

on:
  push:
    paths:
      - 'streamhouse/android/**'
      - 'streamhouse/server/**'
      - 'streamhouse/public/**'
      - 'streamhouse/package.json'
      - 'streamhouse/package-lock.json'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

# The app updates itself to whatever tv-latest holds, so builds publish one at
# a time, in order. A running build is never cancelled halfway through
# replacing the release.
concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the server's dependencies
        working-directory: streamhouse
        run: npm ci --omit=dev

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Every build is signed with the one StreamHouse key, so each installs over
      # the last. The key lives in two repository secrets, ANDROID_KEYSTORE_BASE64
      # and ANDROID_KEYSTORE_PASSWORD (see streamhouse/android/README.md).
      - name: Set up the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [ "$GITHUB_REF" = refs/heads/main ]; then
              echo "::error::The ANDROID_KEYSTORE_BASE64 secret is missing. An APK signed with any other key would not install over the one on your devices, so none is published."
              exit 1
            fi
            echo "::warning::No signing key: this APK is signed with a throwaway key and will not install over other builds."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/streamhouse.p12"
          echo "STREAMHOUSE_KEYSTORE=$RUNNER_TEMP/streamhouse.p12" >> "$GITHUB_ENV"

      # The app updates to a build with a higher versionCode than its own, and
      # Android refuses to install a lower one. Minutes since 2020 only go up,
      # whatever happens to this workflow's run numbers. The name is for people.
      - name: Number the build
        run: |
          echo "STREAMHOUSE_VERSION_CODE=$(( ($(date +%s) - 1577836800) / 60 ))" >> "$GITHUB_ENV"
          echo "STREAMHOUSE_VERSION_NAME=2.$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "STREAMHOUSE_UPDATE_URL=https://github.com/$GITHUB_REPOSITORY/releases/download/tv-latest/" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: streamhouse/android
        env:
          STREAMHOUSE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # version.json is what the app compares itself with.
      - name: Collect the APK
        run: |
          cp streamhouse/android/app/build/outputs/apk/release/app-release.apk streamhouse-tv.apk
          cat > version.json <<EOF
          {"versionCode": $STREAMHOUSE_VERSION_CODE, "versionName": "$STREAMHOUSE_VERSION_NAME", "commit": "${GITHUB_SHA:0:7}", "sha256": "$(sha256sum streamhouse-tv.apk | cut -d' ' -f1)"}
          EOF
          cat version.json

      - name: Upload as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: streamhouse-tv-apk
          path: streamhouse-tv.apk
          if-no-files-found: error

      # A rolling pre-release gives the TV's Downloader app a stable URL to
      # fetch, which is how sideloaded apps are normally installed. Only main
      # publishes it, so a work-in-progress branch never replaces it.
      - name: Publish rolling release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete tv-latest --yes --cleanup-tag || true
          gh release create tv-latest streamhouse-tv.apk \
            --prerelease \
            --title "StreamHouse for Android TV and phones (latest build)" \
            --notes "Built from ${GITHUB_SHA:0:7}. StreamHouse runs inside the app, so no computer is needed.

          Install it on a TV with the Downloader app using the direct link to
          \`streamhouse-tv.apk\` on this release; on a phone, open that link and
          allow the install; or use \`adb install streamhouse-tv.apk\`. After
          that, the app offers each new build itself."
          # Last, so the app never finds a version.json whose APK is not there yet.
          gh release upload tv-latest version.json
