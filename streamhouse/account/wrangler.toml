name = "streamhouse-account"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
# Anyone can create an account, a few an hour from each connection (see
# src/index.js). "false" stops new ones; existing accounts keep working.
ALLOW_SIGNUPS = "true"

[[d1_databases]]
binding = "DB"
database_name = "streamhouse-account"
database_id = "7130ede4-8c08-4d62-9bf2-7f497b2c2751"
migrations_dir = "migrations"
