<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b17">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="StreamHouse">
  <title>StreamHouse</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%237b5bf5'/><path d='M38 30l34 20-34 20z' fill='white'/></svg>">
</head>
<body>
  <div id="app">
    <nav class="rail">
      <div class="logo">S</div>

      <a class="item" href="#/board" title="Home" data-route="board">
        <svg viewBox="0 0 24 24"><path d="M12 3l9 8h-3v10h-5v-6h-2v6H6V11H3z"/></svg>
      </a>
      <a class="item" href="#/discover" title="Discover" data-route="discover">
        <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 100 20 10 10 0 000-20zm3.6 6.4l-2.2 5.2-5.2 2.2 2.2-5.2 5.2-2.2z"/></svg>
      </a>
      <a class="item" href="#/library" title="Library" data-route="library">
        <svg viewBox="0 0 24 24"><path d="M4 3h4v18H4zm6 0h4v18h-4zm7.3.6l3.9 17.5-3.9.9-3.9-17.5z"/></svg>
      </a>
      <a class="item" href="#/downloads" title="Downloads" data-route="downloads">
        <svg viewBox="0 0 24 24"><path d="M12 3v10l4-4 1.4 1.4L12 16.8 6.6 10.4 8 9l4 4V3zM4 19h16v2H4z"/></svg>
        <span class="badge" id="dl-badge" hidden>0</span>
      </a>
      <a class="item" href="#/addons" title="Add-ons" data-route="addons">
        <svg viewBox="0 0 24 24"><path d="M10 3h4v3a2 2 0 104 0V3h3v4h-3a2 2 0 100 4h3v10h-6v-3a2 2 0 10-4 0v3H3v-6h3a2 2 0 100-4H3V3h7z"/></svg>
      </a>

      <div class="spacer"></div>

      <a class="item" href="#/settings" title="Settings" data-route="settings">
        <svg viewBox="0 0 24 24"><path d="M12 8a4 4 0 100 8 4 4 0 000-8zm9 4l2 1.6-1.6 3-2.4-.7a7.6 7.6 0 01-1.7 1l-.4 2.5h-3.6l-.4-2.5a7.6 7.6 0 01-1.7-1l-2.4.7L5.2 14 7 12.4a7 7 0 010-.8L5 10l1.6-3 2.4.7a7.6 7.6 0 011.7-1L11.1 4h3.6l.4 2.5c.6.3 1.2.6 1.7 1l2.4-.7L20.8 10 19 11.6c0 .3 0 .5.1.8z"/></svg>
      </a>
    </nav>

    <main class="stage">
      <header class="topbar">
        <form class="search" id="search-form">
          <svg viewBox="0 0 24 24"><path d="M10 2a8 8 0 105 14.3l5.4 5.4 1.4-1.4-5.4-5.4A8 8 0 0010 2zm0 2a6 6 0 110 12 6 6 0 010-12z"/></svg>
          <input id="search-input" type="search" placeholder="Search movies, series, channels…" autocomplete="off">
        </form>
        <div class="grow"></div>
        <div class="net-stats">
          <span class="down">↓ <b id="net-down">0 B/s</b></span>
          <span class="up">↑ <b id="net-up">0 B/s</b></span>
        </div>
      </header>

      <section class="view" id="view"></section>
    </main>
  </div>

  <div id="player-root"></div>
  <div id="modal-root"></div>
  <div id="toasts"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
